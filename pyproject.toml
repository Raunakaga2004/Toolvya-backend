[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolvaya-backend"
version = "0.1.0"
description = "Toolvaya Django backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django==6.1",
  "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=5.0,<6",
  "pypdf>=5.0,<6",
  "drf-spectacular>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
]
